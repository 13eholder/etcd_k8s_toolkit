[server]
http_addr = 127.0.0.1
http_port = 13000

[paths]
provisioning = ${BENCH_MONITORING_DIR}/grafana/provisioning

[auth.anonymous]
enabled = true
org_role = Viewer

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = warn
