[package]
name = "etcd_proxy_rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "etcd_proxy_rs"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
serde = { version = "1.0", features = ["derive"] }
tokio-stream = "0.1"
async-stream = "0.2"
rand = "0.8"


[build-dependencies]
tonic-prost-build = "0.14"
