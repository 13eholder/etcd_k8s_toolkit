[workspace]
resolver = "3"
members = ["etcd_proxy", "etcd_k8s_bench"]

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
async-stream = "0.2"
clap = { version = "4.5", features = ["derive"] }
prost = "0.14"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "signal",
    "time",
] }
hdrhistogram = "7.6"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"

[workspace.metadata]
name = "etcd_k8s_toolkit"
